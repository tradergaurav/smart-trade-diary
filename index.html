<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Diary Pro - Fully Interactive Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0e17] text-slate-200 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CHECKLIST_ITEMS = [
      "Market Trend Identified (Higher Timeframe)",
      "Key Support & Resistance Levels Marked",
      "Risk per Trade Defined (< 2%)",
      "No Emotional Distraction / Clear Mindset",
      "Stop Loss & Target Orders Planned",
      "Waiting Patiently for Setup Trigger"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [trades, setTrades] = useState(() => {
        const saved = localStorage.getItem('trade_diary_premium_v2');
        return saved ? JSON.parse(saved) : [];
      });

      const [checklist, setChecklist] = useState(() => new Array(CHECKLIST_ITEMS.length).fill(false));
      const [showModal, setShowModal] = useState(false);

      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        symbol: 'NIFTY',
        type: 'BUY',
        qty: '',
        entry: '',
        exit: '',
        strategy: 'Channel Breakout',
        mistake: 'None',
        confidence: 80,
        chartUrl: ''
      });

      useEffect(() => {
        localStorage.setItem('trade_diary_premium_v2', JSON.stringify(trades));
      }, [trades]);

      const handleAddTrade = (e) => {
        e.preventDefault();
        const entry = parseFloat(formData.entry);
        const exit = parseFloat(formData.exit);
        const qty = parseFloat(formData.qty);
        const pnl = (exit - entry) * qty * (formData.type === 'BUY' ? 1 : -1);

        const newTrade = { id: Date.now(), ...formData, pnl: pnl.toFixed(2) };
        setTrades([newTrade, ...trades]);
        setShowModal(false);
        setFormData({ date: new Date().toISOString().split('T')[0], symbol: 'NIFTY', type: 'BUY', qty: '', entry: '', exit: '', strategy: 'Channel Breakout', mistake: 'None', confidence: 80, chartUrl: '' });
      };

      const deleteTrade = (id) => setTrades(trades.filter(t => t.id !== id));

      const totalPnl = trades.reduce((a, b) => a + parseFloat(b.pnl), 0).toFixed(2);
      const wins = trades.filter(t => parseFloat(t.pnl) > 0).length;
      const winRate = trades.length ? ((wins / trades.length) * 100).toFixed(0) : 0;
      const highestPnl = trades.length ? Math.max(...trades.map(t => parseFloat(t.pnl))).toFixed(2) : '0.00';
      const avgConfidence = trades.length ? (trades.reduce((a, b) => a + Number(b.confidence), 0) / trades.length).toFixed(0) : 50;

      const navItems = [
        { name: 'Dashboard', icon: '📊' },
        { name: 'Trading Checklist', icon: '✅' },
        { name: 'Trades', icon: '📈' },
        { name: 'Strategies', icon: '🧩' },
        { name: 'Rules', icon: '📜' },
        { name: 'Mistakes', icon: '⚠️' }
      ];

      return (
        <div class="flex min-h-screen">
          
          {/* Left Sidebar */}
          <aside class="w-64 bg-[#0d1322] border-r border-slate-800/80 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-6">
              <div class="flex items-center space-x-2 px-2">
                <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white text-sm">T</div>
                <span class="font-extrabold text-lg tracking-wide text-white">Trade Diary</span>
              </div>

              <nav class="space-y-1">
                {navItems.map((item) => (
                  <button
                    key={item.name}
                    onClick={() => setActiveTab(item.name)}
                    class={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${
                      activeTab === item.name
                        ? 'bg-indigo-600 text-white font-bold shadow-lg shadow-indigo-600/30'
                        : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.name}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800/80 flex items-center space-x-3">
              <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-xs">GD</div>
              <div class="text-xs overflow-hidden">
                <p class="font-bold text-white truncate">Gaurav Dhiman</p>
                <p class="text-[10px] text-slate-500 truncate">Pro Trader</p>
              </div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main class="flex-1 flex flex-col min-w-0 bg-[#0a0e17]">
            
            {/* Top Market Ticker Bar */}
            <div class="bg-[#0f172a]/90 border-b border-slate-800/80 px-4 py-2 flex items-center justify-between text-[11px]">
              <div class="flex items-center space-x-6 font-mono">
                <span>Nifty Media: <span class="text-emerald-400 font-bold">+2.53%</span></span>
                <span>Nifty Metal: <span class="text-rose-400 font-bold">-1.56%</span></span>
                <span>Nifty Bank: <span class="text-emerald-400 font-bold">+0.95%</span></span>
              </div>
              <button onClick={() => setShowModal(true)} class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1 shadow-md shadow-indigo-600/30">
                <span>+</span>
                <span>New Trade</span>
              </button>
            </div>

            <div class="p-6 overflow-y-auto">

              {/* 1. DASHBOARD VIEW */}
              {activeTab === 'Dashboard' && (
                <div class="space-y-6">
                  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-[#0d1322] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[11px] font-bold text-slate-500 uppercase">HIGHEST P&L</p>
                      <p class="text-xl font-extrabold text-emerald-400 mt-1">₹{highestPnl}</p>
                    </div>
                    <div class="bg-[#0d1322] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[11px] font-bold text-slate-500 uppercase">WIN RATE</p>
                      <p class="text-xl font-extrabold text-indigo-400 mt-1">{winRate}%</p>
                    </div>
                    <div class="bg-[#0d1322] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[11px] font-bold text-slate-500 uppercase">CONFIDENCE INDEX</p>
                      <p class="text-xl font-extrabold text-purple-400 mt-1">{avgConfidence}%</p>
                    </div>
                    <div class="bg-[#0d1322] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[11px] font-bold text-slate-500 uppercase">NET P&L</p>
                      <p class={`text-xl font-extrabold mt-1 ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>₹{totalPnl}</p>
                    </div>
                  </div>

                  <div class="bg-[#0d1322] border border-slate-800/80 p-5 rounded-xl flex flex-col items-center justify-center h-64">
                    <span class="text-slate-500 text-xs font-bold uppercase mb-2">Cumulative Realized P&L</span>
                    <p class={`text-4xl font-black ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>₹{totalPnl}</p>
                    <p class="text-xs text-slate-500 mt-2">{trades.length} Total Executed Trades Logged</p>
                  </div>
                </div>
              )}

              {/* 2. TRADING CHECKLIST VIEW */}
              {activeTab === 'Trading Checklist' && (
                <div class="bg-[#0d1322] border border-slate-800/80 p-6 rounded-2xl space-y-4 max-w-2xl mx-auto">
                  <h2 class="text-base font-bold text-indigo-400 border-b border-slate-800 pb-2">Pre-Market Execution Checklist</h2>
                  <p class="text-xs text-slate-400">Complete these checks before taking any trade to maintain strict discipline.</p>
                  <div class="space-y-3 pt-2">
                    {CHECKLIST_ITEMS.map((item, idx) => (
                      <label key={idx} class="flex items-center space-x-3 p-3 bg-slate-900/60 rounded-xl border border-slate-800 cursor-pointer text-xs">
                        <input
                          type="checkbox"
                          checked={checklist[idx]}
                          onChange={() => {
                            const updated = [...checklist];
                            updated[idx] = !updated[idx];
                            setChecklist(updated);
                          }}
                          class="accent-indigo-500 w-4 h-4"
                        />
                        <span class={checklist[idx] ? 'line-through text-slate-500' : 'text-slate-200'}>{item}</span>
                      </label>
                    ))}
                  </div>
                </div>
              )}

              {/* 3. TRADES LOG VIEW */}
              {activeTab === 'Trades' && (
                <div class="bg-[#0d1322] border border-slate-800/80 rounded-2xl overflow-hidden">
                  <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h2 class="font-bold text-sm text-slate-200">Trade Execution Diary</h2>
                  </div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                      <thead class="bg-slate-950 text-slate-400 uppercase">
                        <tr>
                          <th class="p-3">Date</th>
                          <th class="p-3">Symbol</th>
                          <th class="p-3">Strategy</th>
                          <th class="p-3">Type</th>
                          <th class="p-3">Qty</th>
                          <th class="p-3">Entry / Exit</th>
                          <th class="p-3">P&L</th>
                          <th class="p-3">Mistake</th>
                          <th class="p-3">Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        {trades.length === 0 ? (
                          <tr><td colSpan="9" class="p-6 text-center text-slate-500">No trades logged yet. Click "+ New Trade" to start.</td></tr>
                        ) : (
                          trades.map(t => (
                            <tr key={t.id} class="border-b border-slate-800/60 hover:bg-slate-800/30">
                              <td class="p-3 text-slate-500">{t.date}</td>
                              <td class="p-3 font-bold text-white">{t.symbol}</td>
                              <td class="p-3 text-indigo-400">{t.strategy}</td>
                              <td class={`p-3 font-bold ${t.type === 'BUY' ? 'text-emerald-400' : 'text-amber-400'}`}>{t.type}</td>
                              <td class="p-3">{t.qty}</td>
                              <td class="p-3">{t.entry} / {t.exit}</td>
                              <td class={`p-3 font-bold ${parseFloat(t.pnl) >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>₹{t.pnl}</td>
                              <td class="p-3"><span class={`px-2 py-0.5 rounded text-[10px] ${t.mistake === 'None' ? 'bg-slate-900 text-slate-500' : 'bg-rose-950 text-rose-300 border border-rose-800'}`}>{t.mistake}</span></td>
                              <td class="p-3"><button onClick={() => deleteTrade(t.id)} class="text-rose-400 hover:underline">Delete</button></td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 4. STRATEGIES VIEW */}
              {activeTab === 'Strategies' && (
                <div class="bg-[#0d1322] border border-slate-800/80 p-6 rounded-2xl space-y-4">
                  <h2 class="text-sm font-bold text-slate-200">Strategy Performance Analysis</h2>
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {["Channel Breakout", "Fibo Level", "W / M Pattern", "Range Break"].map((strat, i) => {
                      const stratTrades = trades.filter(t => t.strategy === strat);
                      const stratPnl = stratTrades.reduce((a, b) => a + parseFloat(b.pnl), 0).toFixed(2);
                      return (
                        <div key={i} class="bg-slate-900/60 border border-slate-800 p-4 rounded-xl">
                          <p class="font-bold text-xs text-indigo-300">{strat}</p>
                          <p class="text-xs text-slate-500 mt-1">Trades: {stratTrades.length}</p>
                          <p class={`text-lg font-bold mt-2 ${stratPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>₹{stratPnl}</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 5. RULES VIEW */}
              {activeTab === 'Rules' && (
                <div class="bg-[#0d1322] border border-slate-800/80 p-6 rounded-2xl space-y-4 max-w-2xl">
                  <h2 class="text-sm font-bold text-slate-200">Personal Trading System Rules</h2>
                  <ul class="space-y-3 text-xs text-slate-300 list-disc pl-5">
                    <li>Never take more than 2 trades per day.</li>
                    <li>Always place Stop Loss in the system, never in mind.</li>
                    <li>No trading after 2 consecutive losses.</li>
                    <li>Do not enter based on Telegram tips or social media reels.</li>
                  </ul>
                </div>
              )}

              {/* 6. MISTAKES TRACKER VIEW */}
              {activeTab === 'Mistakes' && (
                <div class="bg-[#0d1322] border border-slate-800/80 p-6 rounded-2xl space-y-4">
                  <h2 class="text-sm font-bold text-rose-400">Psychological Mistakes Breakdown</h2>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {["FOMO", "Revenge", "No SL", "Over-leveraging"].map((m, i) => {
                      const count = trades.filter(t => t.mistake.includes(m)).length;
                      return (
                        <div key={i} class="bg-slate-900/60 border border-slate-800 p-4 rounded-xl text-center">
                          <p class="text-xs text-slate-400">{m}</p>
                          <p class="text-2xl font-black text-rose-400 mt-1">{count}</p>
                          <p class="text-[10px] text-slate-500 mt-1">Occurrences</p>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* New Trade Modal */}
          {showModal && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-[#0d1322] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 class="font-bold text-sm text-white">Log New Execution</h3>
                  <button onClick={() => setShowModal(false)} class="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddTrade} class="space-y-3 text-xs">
                  <div class="grid grid-cols-2 gap-3">
                    <input type="text" placeholder="Symbol (e.g. NIFTY)" value={formData.symbol} onChange={e=>setFormData({...formData, symbol: e.target.value.toUpperCase()})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg" required />
                    <select value={formData.type} onChange={e=>setFormData({...formData, type: e.target.value})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg">
                      <option value="BUY">BUY</option>
                      <option value="SELL">SELL</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-3 gap-3">
                    <input type="number" placeholder="Qty" value={formData.qty} onChange={e=>setFormData({...formData, qty: e.target.value})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg" required />
                    <input type="number" step="any" placeholder="Entry" value={formData.entry} onChange={e=>setFormData({...formData, entry: e.target.value})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg" required />
                    <input type="number" step="any" placeholder="Exit" value={formData.exit} onChange={e=>setFormData({...formData, exit: e.target.value})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg" required />
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <select value={formData.strategy} onChange={e=>setFormData({...formData, strategy: e.target.value})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-indigo-300">
                      <option value="Channel Breakout">Channel Breakout</option>
                      <option value="Fibo Level">Fibo Level</option>
                      <option value="W / M Pattern">W / M Pattern</option>
                      <option value="Range Break">Range Break</option>
                    </select>
                    <select value={formData.mistake} onChange={e=>setFormData({...formData, mistake: e.target.value})} class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-rose-300">
                      <option value="None">No Mistake</option>
                      <option value="FOMO Entry">FOMO Entry</option>
                      <option value="Revenge Trade">Revenge Trade</option>
                      <option value="No SL">No Stop Loss</option>
                    </select>
                  </div>
                  <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl text-white transition">Save Execution</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
