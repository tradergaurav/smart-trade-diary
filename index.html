<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Trade Diary - Complete Sheet & Execution Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#080c14] text-slate-200 antialiased font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SETUPS = ["Channel Breakout", "Range Break", "Inside Candle", "Fibo Level", "W / M Pattern", "Cup & Handle", "C & H", "Triangle", "Wedge"];
    const SYMBOLS = ["NIFTY", "BANKNIFTY", "FINNIFTY", "SENSEX", "BTC", "ETH", "SOL"];
    const AVOID_REASONS = [
      "Market is Sideways (मार्केट साइडवेज है)",
      "Direction is not clear (कोई डायरेक्शन क्लियर नहीं है)",
      "Busy somewhere else (मैं कहीं और बिजी हूं)",
      "Not sitting on PC Setup / Trading from Mobile (पीसी पर नहीं बैठा हूँ)"
    ];

    const OUTCOME_TAGS = [
      "Target Hit", "Trail Target Hit", "CTC Target Hit",
      "SL Hit", "SL CTC Hit", "Missed - Hit Target Later", "Avoided - Saved Loss"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [trades, setTrades] = useState(() => {
        const saved = localStorage.getItem('tradediary_sheet_v12');
        return saved ? JSON.parse(saved) : [];
      });

      const [showModal, setShowModal] = useState(false);
      const [editingTrade, setEditingTrade] = useState(null);

      // 14-Mindset Question States
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        planTime: '09:30',
        entryTime: '',
        status: 'PLANNED',
        symbol: 'NIFTY',
        type: 'BUY',
        setup: 'Channel Breakout',
        qty: '',
        entry: '',
        exit: '',
        sl: '',
        target: '',
        risk: '1000',
        fee: '20',
        outcome: 'Target Hit',
        avoidReason: '',
        chartUrl: '',
        notes: '',
        lesson: '',
        mistakeTag: 'None',
        
        // Checklist Answers
        q1_overconfident: 'No',
        q2_lossEmotional: 'No',
        q3_htfDirection: 'Yes',
        q4_setupClass: 'A (Clean)',
        q5_onPC: 'Yes',
        q6_backtested: 'Yes',
        q7_confidence: 'High',
        q8_tradeSeq: '1st',
        q9_targetSlClear: 'Yes',
        q10_fomo: 'No',
        q11_impatient: 'No',
        q12_timepass: 'No'
      });

      const pnlChartRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('tradediary_sheet_v12', JSON.stringify(trades));
      }, [trades]);

      // Calculate Mindset Score
      const calculateScore = (data) => {
        let pts = 0;
        if (data.q1_overconfident === 'No') pts += 1;
        if (data.q2_lossEmotional === 'No') pts += 1;
        if (data.q3_htfDirection === 'Yes') pts += 1;
        if (data.q4_setupClass === 'A (Clean)') pts += 1; else if (data.q4_setupClass === 'B (Decent)') pts += 0.5;
        if (data.q5_onPC === 'Yes') pts += 1;
        if (data.q6_backtested === 'Yes') pts += 1;
        if (data.q7_confidence === 'High') pts += 1; else if (data.q7_confidence === 'Medium') pts += 0.5;
        if (data.q8_tradeSeq === '1st') pts += 1; else if (data.q8_tradeSeq === '2nd') pts += 0.5;
        if (data.q9_targetSlClear === 'Yes') pts += 1;
        if (data.q10_fomo === 'No') pts += 1;
        if (data.q11_impatient === 'No') pts += 1;
        if (data.q12_timepass === 'No') pts += 1;

        const pct = ((pts / 12) * 100).toFixed(1);
        let decision = 'ALLOW: Full Quantity';
        if (pct < 50) decision = 'REJECT: Do Not Trade';
        else if (pct < 80) decision = 'ALLOW: Half Quantity';

        return { pts, pct, decision };
      };

      // Export CSV
      const exportCSV = () => {
        if (!trades.length) return alert('No trades to export!');
        const headers = ["Date", "Plan Time", "Entry Time", "Status", "Symbol", "Type", "Setup", "Qty", "Entry", "Exit", "P&L", "Outcome", "Mindset Score %", "Decision", "Chart URL"];
        const rows = trades.map(t => [t.date, t.planTime, t.entryTime, t.status, t.symbol, t.type, t.setup, t.qty, t.entry, t.exit, t.pnl, t.outcome, t.mindsetScorePct, t.mindsetDecision, t.chartUrl]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Trade_Diary_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
      };

      // Import CSV
      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const lines = text.split('\n').slice(1);
          const imported = lines.map(line => {
            const cols = line.split(',');
            if (cols.length < 5) return null;
            return {
              id: Date.now() + Math.random(),
              date: cols[0], planTime: cols[1], entryTime: cols[2], status: cols[3],
              symbol: cols[4], type: cols[5], setup: cols[6], qty: cols[7],
              entry: cols[8], exit: cols[9], pnl: cols[10], outcome: cols[11],
              mindsetScorePct: cols[12], mindsetDecision: cols[13], chartUrl: cols[14]
            };
          }).filter(Boolean);

          setTrades([...imported, ...trades]);
          alert(`Successfully imported ${imported.length} trades!`);
        };
        reader.readAsText(file);
      };

      // Render Equity Curve Chart
      useEffect(() => {
        if (activeTab !== 'Dashboard') return;
        if (pnlChartRef.current) {
          const ctx = pnlChartRef.current.getContext('2d');
          let cumPnl = 0;
          const takenTrades = trades.filter(t => t.status === 'TAKEN');
          const labels = takenTrades.map(t => t.date);
          const data = takenTrades.map(t => {
            cumPnl += parseFloat(t.pnl || 0);
            return cumPnl;
          });

          if (window.myPnlChart) window.myPnlChart.destroy();
          window.myPnlChart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels.length ? labels : ['Day 1'],
              datasets: [{
                label: 'Cumulative P&L (₹)',
                data: data.length ? data : [0],
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true,
                tension: 0.35,
                borderWidth: 2,
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#64748b' } },
                y: { grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#64748b' } }
              }
            }
          });
        }
      }, [activeTab, trades]);

      const handleSaveTrade = (e) => {
        e.preventDefault();
        let pnl = '0.00';
        if (formData.status === 'TAKEN' && formData.entry && formData.exit && formData.qty) {
          const entry = parseFloat(formData.entry);
          const exit = parseFloat(formData.exit);
          const qty = parseFloat(formData.qty);
          pnl = ((exit - entry) * qty * (formData.type === 'BUY' ? 1 : -1)).toFixed(2);
        }

        const scoreInfo = calculateScore(formData);

        const newTrade = {
          id: editingTrade ? editingTrade.id : Date.now(),
          ...formData,
          pnl,
          mindsetPts: scoreInfo.pts,
          mindsetScorePct: scoreInfo.pct,
          mindsetDecision: scoreInfo.decision
        };

        if (editingTrade) {
          setTrades(trades.map(t => t.id === editingTrade.id ? newTrade : t));
        } else {
          setTrades([newTrade, ...trades]);
        }

        setShowModal(false);
        setEditingTrade(null);
      };

      const openEditModal = (t) => {
        setEditingTrade(t);
        setFormData({ ...t });
        setShowModal(true);
      };

      const deleteTrade = (id) => setTrades(trades.filter(t => t.id !== id));

      const takenTrades = trades.filter(t => t.status === 'TAKEN');
      const totalPnl = takenTrades.reduce((a, b) => a + parseFloat(b.pnl || 0), 0).toFixed(2);
      const wins = takenTrades.filter(t => parseFloat(t.pnl) > 0).length;
      const winRate = takenTrades.length ? ((wins / takenTrades.length) * 100).toFixed(0) : 0;

      return (
        <div class="flex h-screen overflow-hidden bg-[#080c14] text-slate-300">
          
          {/* Sidebar */}
          <aside class="w-60 bg-[#0d1320] border-r border-slate-800/80 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-6">
              <div class="flex items-center space-x-2 px-2">
                <div class="w-7 h-7 bg-blue-600 rounded flex items-center justify-center font-black text-white text-xs">📊</div>
                <span class="font-extrabold text-sm text-white">Trade Diary Pro</span>
              </div>

              <nav class="space-y-1">
                {['Dashboard', 'Execution Pipeline & Audit', 'Import & Export Data'].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setActiveTab(tab)}
                    class={`w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold transition ${
                      activeTab === tab ? 'bg-blue-600 text-white font-bold shadow-md' : 'text-slate-400 hover:bg-slate-800/40'
                    }`}
                  >
                    {tab}
                  </button>
                ))}
              </nav>
            </div>

            <div class="p-2.5 bg-[#0a0f1d] rounded-xl border border-slate-800 flex items-center space-x-2.5">
              <div class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-[10px]">GD</div>
              <div class="text-xs">
                <p class="font-bold text-white text-[11px]">Gaurav Dhiman</p>
                <p class="text-[9px] text-emerald-400">Sheet Sync Active</p>
              </div>
            </div>
          </aside>

          {/* Main Area */}
          <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <header class="bg-[#0b101c] border-b border-slate-800/80 px-6 py-2.5 flex items-center justify-between sticky top-0 z-10">
              <div class="flex space-x-6 text-xs font-mono items-center">
                <span class="text-slate-400">NIFTY: <span class="text-emerald-400 font-bold">26,042.80</span></span>
                <span class="text-slate-400">BANKNIFTY: <span class="text-rose-400 font-bold">59,011.35</span></span>
              </div>
              <button onClick={() => {
                setEditingTrade(null);
                setShowModal(true);
              }} class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded font-bold text-xs shadow-md">
                + Plan New Trade & Mindset Check
              </button>
            </header>

            <div class="p-6 space-y-5 max-w-[1400px] mx-auto w-full">

              {activeTab === 'Dashboard' && (
                <div class="space-y-5">
                  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-[#0c1220] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[10px] font-bold text-slate-500 uppercase">NET REALIZED P&L</p>
                      <p class={`text-2xl font-black mt-1 ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>₹{totalPnl}</p>
                    </div>
                    <div class="bg-[#0c1220] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[10px] font-bold text-slate-500 uppercase">WIN RATE</p>
                      <p class="text-2xl font-black text-blue-400 mt-1">{winRate}%</p>
                    </div>
                    <div class="bg-[#0c1220] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[10px] font-bold text-slate-500 uppercase">MISSED TRADES</p>
                      <p class="text-2xl font-black text-amber-400 mt-1">{trades.filter(t => t.status === 'MISSED').length}</p>
                    </div>
                    <div class="bg-[#0c1220] border border-slate-800/80 p-4 rounded-xl">
                      <p class="text-[10px] font-bold text-slate-500 uppercase">AVOIDED SAVES</p>
                      <p class="text-2xl font-black text-indigo-400 mt-1">{trades.filter(t => t.status === 'AVOIDED').length}</p>
                    </div>
                  </div>

                  <div class="bg-[#0c1220] border border-slate-800/80 p-4 rounded-xl h-72">
                    <span class="font-bold text-xs text-slate-300">Realized Cumulative Equity Curve</span>
                    <div class="h-56 w-full pt-2"><canvas ref={pnlChartRef}></canvas></div>
                  </div>
                </div>
              )}

              {/* EXECUTION PIPELINE */}
              {activeTab === 'Execution Pipeline & Audit' && (
                <div class="bg-[#0c1220] border border-slate-800 rounded-xl overflow-hidden">
                  <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h2 class="font-bold text-xs text-slate-200">Execution Pipeline & Mindset Audit Log</h2>
                  </div>
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                      <thead class="bg-slate-950 text-slate-500 uppercase text-[9px]">
                        <tr>
                          <th class="p-3">Status</th>
                          <th class="p-3">Symbol</th>
                          <th class="p-3">Setup</th>
                          <th class="p-3">P&L</th>
                          <th class="p-3">Outcome</th>
                          <th class="p-3">Mindset Score</th>
                          <th class="p-3">System Decision</th>
                          <th class="p-3">Chart Link</th>
                          <th class="p-3">Action</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800/60">
                        {trades.map(t => (
                          <tr key={t.id} class="hover:bg-slate-800/20">
                            <td class="p-3">
                              <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                t.status === 'PLANNED' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                                t.status === 'TAKEN' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' :
                                t.status === 'MISSED' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                                'bg-slate-800 text-slate-300'
                              }`}>{t.status}</span>
                            </td>
                            <td class="p-3 font-bold text-white">{t.symbol}</td>
                            <td class="p-3 text-blue-400">{t.setup}</td>
                            <td class={`p-3 font-black ${parseFloat(t.pnl) >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>₹{t.pnl}</td>
                            <td class="p-3"><span class="bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-[10px]">{t.outcome}</span></td>
                            <td class="p-3 font-mono font-bold text-indigo-400">{t.mindsetScorePct || '100'}%</td>
                            <td class="p-3"><span class="text-emerald-300 font-bold">{t.mindsetDecision || 'ALLOW'}</span></td>
                            <td class="p-3">{t.chartUrl ? <a href={t.chartUrl} target="_blank" class="text-blue-400 underline font-bold">Chart</a> : '-'}</td>
                            <td class="p-3 space-x-2">
                              <button onClick={() => openEditModal(t)} class="text-blue-400 hover:underline font-bold">Edit</button>
                              <button onClick={() => deleteTrade(t.id)} class="text-rose-400 hover:underline">Delete</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* IMPORT & EXPORT DATA */}
              {activeTab === 'Import & Export Data' && (
                <div class="bg-[#0c1220] border border-slate-800 p-6 rounded-xl space-y-6 max-w-xl mx-auto">
                  <h2 class="font-bold text-sm text-slate-200 border-b border-slate-800 pb-2">Sync with Google Sheets / Backup Data</h2>
                  
                  <div class="space-y-3">
                    <p class="text-xs text-slate-400">Export all logged trade executions and mindset audit scores into a CSV spreadsheet file.</p>
                    <button onClick={exportCSV} class="bg-blue-600 hover:bg-blue-500 font-bold px-4 py-2.5 rounded text-xs text-white shadow-md">
                      📥 Download CSV Data File
                    </button>
                  </div>

                  <div class="space-y-3 pt-4 border-t border-slate-800">
                    <p class="text-xs text-slate-400">Import an existing Google Sheet CSV file into the Trade Diary dashboard.</p>
                    <input type="file" accept=".csv" onChange={handleImportCSV} class="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-blue-400 hover:file:bg-slate-700 cursor-pointer" />
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* 14-Question Mindset Check & Trade Modal */}
          {showModal && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div class="bg-[#0c1220] border border-slate-800 rounded-xl w-full max-w-2xl p-5 space-y-4 my-8">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                  <h3 class="font-bold text-xs text-white">{editingTrade ? 'Update Execution Log' : 'Pre-Trade Mindset Audit & Plan'}</h3>
                  <button onClick={() => setShowModal(false)} class="text-slate-500 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveTrade} class="space-y-4 text-xs">
                  
                  {/* 12 Checklist Questions Grid */}
                  <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800 space-y-3">
                    <p class="font-bold text-blue-400 border-b border-slate-800 pb-1 uppercase tracking-wider text-[10px]">12-Parameter Mindset Audit Checklist</p>
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Overconfident from previous profit?</label>
                        <select value={formData.q1_overconfident} onChange={e=>setFormData({...formData, q1_overconfident: e.target.value})} class="w-full bg-slate-950 border border-slate-800 p-1.5 rounded">
                          <option value="No">No</option>
                          <option value="Yes">Yes</option>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Carrying previous loss emotionally?</label>
                        <select value={formData.q2_lossEmotional} onChange={e=>setFormData({...formData, q2_lossEmotional: e.target.value})} class="w-full bg-slate-950 border border-slate-800 p-1.5 rounded">
                          <option value="No">No</option>
                          <option value="Yes">Yes</option>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">HTF Bigger Picture Direction Clear?</label>
                        <select value={formData.q3_htfDirection} onChange={e=>setFormData({...formData, q3_htfDirection: e.target.value})} class="w-full bg-slate-950 border border-slate-800 p-1.5 rounded">
                          <option value="Yes">Yes</option>
                          <option value="No">No</option>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Setup Quality Class</label>
                        <select value={formData.q4_setupClass} onChange={e=>setFormData({...formData, q4_setupClass: e.target.value})} class="w-full bg-slate-950 border border-slate-800 p-1.5 rounded">
                          <option value="A (Clean)">A (Clean Setup)</option>
                          <option value="B (Decent)">B (Decent Setup)</option>
                          <option value="C (Random)">C (Random Setup)</option>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Sitting on PC Setup?</label>
                        <select value={formData.q5_onPC} onChange={e=>setFormData({...formData, q5_onPC: e.target.value})} class="w-full bg-slate-950 border border-slate-800 p-1.5 rounded">
                          <option value="Yes">Yes</option>
                          <option value="No">No</option>
                        </select>
                      </div>
                      <div>
                        <label class="text-[10px] text-slate-400 block mb-1">Feeling FOMO / Impatient?</label>
                        <select value={formData.q10_fomo} onChange={e=>setFormData({...formData, q10_fomo: e.target.value})} class="w-full bg-slate-950 border border-slate-800 p-1.5 rounded">
                          <option value="No">No</option>
                          <option value="Yes">Yes</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* Execution Details */}
                  <div class="grid grid-cols-3 gap-2.5">
                    <select value={formData.symbol} onChange={e=>setFormData({...formData, symbol: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded text-white font-bold">
                      {SYMBOLS.map((s, i) => <option key={i} value={s}>{s}</option>)}
                    </select>
                    <select value={formData.setup} onChange={e=>setFormData({...formData, setup: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded text-blue-300 font-bold">
                      {SETUPS.map((s, i) => <option key={i} value={s}>{s}</option>)}
                    </select>
                    <select value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded">
                      <option value="PLANNED">PLANNED</option>
                      <option value="TAKEN">TAKEN</option>
                      <option value="AVOIDED">AVOIDED</option>
                      <option value="MISSED">MISSED</option>
                    </select>
                  </div>

                  <div class="grid grid-cols-4 gap-2.5">
                    <input type="number" placeholder="Qty" value={formData.qty} onChange={e=>setFormData({...formData, qty: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded" />
                    <input type="number" step="any" placeholder="Entry" value={formData.entry} onChange={e=>setFormData({...formData, entry: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded" />
                    <input type="number" step="any" placeholder="Exit" value={formData.exit} onChange={e=>setFormData({...formData, exit: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded" />
                    <select value={formData.type} onChange={e=>setFormData({...formData, type: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded">
                      <option value="BUY">BUY</option>
                      <option value="SELL">SELL</option>
                    </select>
                  </div>

                  <div class="grid grid-cols-2 gap-2.5">
                    <select value={formData.outcome} onChange={e=>setFormData({...formData, outcome: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded text-emerald-300">
                      {OUTCOME_TAGS.map((tag, idx) => <option key={idx} value={tag}>{tag}</option>)}
                    </select>
                    <input type="url" placeholder="TradingView Screenshot Link" value={formData.chartUrl} onChange={e=>setFormData({...formData, chartUrl: e.target.value})} class="bg-slate-900 border border-slate-800 p-2 rounded" />
                  </div>

                  <textarea placeholder="Lesson / Notes" value={formData.notes} onChange={e=>setFormData({...formData, notes: e.target.value})} class="w-full bg-slate-900 border border-slate-800 p-2 rounded h-14"></textarea>

                  <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded text-white transition shadow-md shadow-blue-600/30">
                    Save Trade & Calculate Mindset Score
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
